<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5ef">
<title>Acervo Guerreiras · A história do futebol feminino, vestida em campo</title>
<meta name="description" content="Camisas de jogo de seleções femininas, de 1992 a 2024, em duas coleções: Pioneiras e Legends.">
<meta property="og:title" content="Acervo Guerreiras · A história do futebol feminino, vestida em campo">
<meta property="og:description" content="Camisas de jogo de seleções femininas, de 1992 a 2024, em duas coleções: Pioneiras e Legends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23b08d4a' stroke-width='6'/%3E%3Cpath d='M50 10v80' stroke='%23b08d4a' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --porcelana:#f3f5ef;
  --papel:#ffffff;
  --tinta:#10261f;
  --tinta-2:#4a5a52;
  --linha:#d3d9cf;
  --ouro:#b08d4a;
  --ouro-esc:#7a5d27;
  --campo:#1d4a3a;
  --foto:#a7a8a2;
  --cor:#1d4a3a;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --texto:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(20px,5vw,72px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--porcelana);color:var(--tinta);font-family:var(--texto);font-weight:400;font-size:1.0625rem;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .38  0 0 0 0 .32  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
img{display:block;max-width:100%}
h1,h2,h3,h4,.selo-num,.legenda .num,.legenda .pais,.trilho .ano,.cron-ano{font-optical-sizing:none;font-variation-settings:"opsz" 28}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--campo);outline-offset:3px}

/* ---------- Abertura (sem foto de destaque: tipografia e o círculo de meio-campo) ---------- */
.hero{position:relative;overflow:hidden}
.hero-in{position:relative;z-index:1;padding:clamp(18px,4vh,40px) var(--gutter) clamp(40px,7vh,88px);display:grid;gap:clamp(24px,4vw,72px);
  grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:center;max-width:1500px;margin:0 auto}
.hero .marca{font-size:1rem;color:var(--tinta-2);margin:0 0 clamp(28px,9vh,104px);font-weight:500}
.hero h1{font-family:var(--display);font-weight:500;line-height:1;letter-spacing:-.015em;margin:0;
  font-size:clamp(2.5rem,6.8vw,6.4rem);text-wrap:balance}
.hero .sub{font-size:clamp(1.05rem,1.5vw,1.25rem);max-width:38ch;margin:clamp(20px,3vh,32px) 0 0;color:var(--tinta-2);font-weight:300}
.hero .sub strong{color:var(--tinta);font-weight:600}
.selo{position:relative;width:min(100%,430px);aspect-ratio:1;justify-self:center}
.selo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.selo svg *{fill:none;stroke:var(--ouro);stroke-width:1}
.selo svg .ponto{fill:var(--ouro);stroke:none}
.selo-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 12%}
.selo-num{font-family:var(--display);font-weight:500;font-size:clamp(4.6rem,10vw,7.6rem);line-height:.9;letter-spacing:-.03em}
.selo-leg{font-size:1.05rem;color:var(--tinta-2);margin-top:6px}
.selo-anos{font-family:var(--display);font-style:italic;color:var(--ouro-esc);font-size:clamp(1.25rem,2.2vw,1.75rem);margin-top:16px;padding-top:16px;border-top:1px solid var(--ouro)}
@media (max-width:860px){
  .hero-in{grid-template-columns:1fr}
  .hero .marca{margin-bottom:28px}
  .selo{width:min(78vw,320px);justify-self:start}
}
.mat{background:var(--papel);padding:clamp(8px,1.2vw,14px);border:1px solid var(--linha);transition:border-color .25s}

/* ---------- Seletor de idioma ---------- */
.idioma{display:inline-flex;border:1px solid var(--ouro)}
.idioma button{background:transparent;border:0;border-right:1px solid var(--ouro);padding:6px 12px;font-family:var(--display);font-weight:600;font-size:.95rem;line-height:1.2;color:var(--tinta)}
.idioma button:last-child{border-right:0}
.idioma button[aria-pressed="true"]{background:var(--tinta);color:var(--porcelana)}
.idioma button:hover:not([aria-pressed="true"]){background:var(--papel)}
.barra{position:relative;z-index:3;max-width:1500px;margin:0 auto;padding:clamp(14px,2.5vh,24px) var(--gutter) 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.link-sobre{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--ouro);padding:4px 0}
.link-sobre:hover{border-bottom-width:2px}
#vista-sobre .sobre{padding-top:clamp(36px,8vh,96px);min-height:58vh}
.contato-rod{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--tinta);text-decoration-color:var(--ouro);text-underline-offset:4px}
.rodape-linha{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}

/* ---------- As duas coleções (portas) ---------- */
.portas{max-width:1500px;margin:0 auto;padding:0 var(--gutter) clamp(36px,6vh,72px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px)}
.porta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;text-decoration:none;color:inherit;background:var(--papel);
  border:1px solid var(--linha);padding:clamp(16px,2vw,26px);transition:border-color .25s}
.porta:hover,.porta:focus-visible{border-color:var(--ouro)}
.porta h2{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,3vw,2.6rem);line-height:1.05;margin:0 0 6px;letter-spacing:-.01em}
.porta p{margin:0;color:var(--tinta-2);font-size:.98rem;line-height:1.45}
.porta .fotos{display:flex;gap:6px}
.porta .fotos img{width:clamp(44px,6vw,78px);aspect-ratio:4/5;object-fit:cover;background:var(--foto);border:1px solid var(--linha)}
@media (max-width:760px){.portas{grid-template-columns:1fr}}

/* ---------- Trilho ---------- */
.trilho{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--porcelana) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-block:1px solid var(--linha);
  padding-top:env(safe-area-inset-top,0px)}
.trilho-rolagem{overflow-x:auto;scrollbar-width:none}
.trilho-rolagem::-webkit-scrollbar{display:none}
.trilho ol{list-style:none;margin:0 auto;padding:10px var(--gutter) 8px;display:flex;gap:2px;min-width:720px;max-width:1500px}
.trilho li{flex:1 1 0;min-width:0}
.trilho li.sep{margin-left:14px;padding-left:14px;border-left:1px solid var(--linha)}
.trilho a{display:block;text-decoration:none;color:var(--tinta-2);padding:0 4px;position:relative}
.trilho .barra{display:block;height:2px;background:var(--cor);opacity:.4;margin-bottom:6px;transition:opacity .2s}
.trilho .linha1{display:flex;align-items:center;gap:6px}
.trilho .mini{width:18px;height:18px;flex:none}
.trilho .estrela{width:18px;text-align:center;font-size:.9rem;line-height:1;color:var(--ouro-esc);flex:none}
.trilho .ano{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1;color:var(--tinta-2)}
.trilho .nome{display:block;font-size:.78rem;line-height:1.3}
.trilho a[aria-current="true"] .barra,.trilho a:hover .barra{opacity:1}
.trilho a[aria-current="true"] .ano,.trilho a:hover .ano,.trilho a[aria-current="true"] .nome{color:var(--tinta)}

/* ---------- Marcadores ---------- */
.chip{width:30px;height:30px;display:block;flex:none;overflow:visible}
.chip .f{fill:#fff;stroke:var(--ouro-esc);stroke-width:1.6}
.chip.prov .f{stroke-dasharray:3.2 2.6}
.chip.prep .f{stroke-dasharray:.1 3.4;stroke-linecap:round;stroke-width:2.2}
.chip.ok .f{fill:#e6d19f}
.chip text{font-family:var(--display);font-weight:600;font-size:11px;fill:var(--tinta);text-anchor:middle}
.chip.grande{width:46px;height:46px}
.marcas-leg{max-width:1500px;margin:0 auto;padding:22px var(--gutter) 0;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;font-size:.92rem;color:var(--tinta-2)}
.marcas-leg span.it{display:inline-flex;align-items:center;gap:8px}

/* ---------- Coleções e capítulos ---------- */
.colecao{max-width:1500px;margin:0 auto;padding:clamp(56px,10vh,120px) var(--gutter) 0}
.col-cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,4vw,64px);align-items:end;border-bottom:1px solid var(--linha);padding-bottom:clamp(28px,5vh,56px)}
.col-cab h2{font-family:var(--display);font-weight:500;font-size:clamp(2.6rem,7vw,6rem);line-height:.98;letter-spacing:-.02em;margin:0}
.col-cab .resumo{font-family:var(--display);font-style:italic;color:var(--ouro-esc);font-size:1.3rem;margin:12px 0 0}
.col-cab p.intro{margin:0;max-width:58ch;font-size:1.1rem;font-weight:300}
@media (max-width:760px){.col-cab{grid-template-columns:1fr;align-items:start}}

.cap{padding-top:clamp(48px,8vh,96px);scroll-margin-top:84px}
.cap-cab{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,4vw,64px);align-items:end;
  border-top:1px solid var(--ouro);padding-top:26px}
.cap-cab::before{content:"";position:absolute;left:0;top:-7px;width:13px;height:13px;border:1px solid var(--ouro);border-radius:50%;background:var(--porcelana)}
.cap-tit{display:flex;gap:16px;align-items:center}
.cap-cab h3{font-family:var(--display);font-weight:500;font-size:clamp(2rem,4.6vw,4rem);line-height:1;letter-spacing:-.01em;margin:0}
.cap-cab .local{font-family:var(--display);font-style:italic;color:var(--ouro-esc);font-size:1.15rem;margin:8px 0 0}
.cap-cab .gancho{margin:0;max-width:44ch;font-family:var(--display);font-weight:400;font-size:clamp(1.2rem,2vw,1.6rem);line-height:1.3}
.cap .estrela-g{width:46px;height:46px;border:1px solid var(--ouro-esc);border-radius:50%;display:grid;place-items:center;color:var(--ouro-esc);font-size:1.3rem;flex:none}
@media (max-width:760px){.cap-cab{grid-template-columns:1fr;align-items:start}}

.cap-corpo{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:clamp(20px,4vw,64px);margin-top:clamp(24px,4vh,40px)}
.fatos{margin:0;display:grid;gap:14px;align-content:start;border-left:1px solid var(--ouro);padding-left:18px}
.fatos div{display:grid;gap:2px}
.fatos dt{font-size:.85rem;color:var(--tinta-2)}
.fatos dd{margin:0;font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.25}
.historia-cap p{margin:0 0 1em;max-width:64ch;font-size:1.05rem;font-weight:300}
.historia-cap p:last-child{margin-bottom:0}
@media (max-width:860px){.cap-corpo{grid-template-columns:1fr}}

.placas{list-style:none;margin:clamp(28px,5vh,48px) 0 0;padding:0;display:grid;gap:clamp(22px,2.8vw,44px) clamp(14px,2vw,30px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
@media (max-width:620px){.placas{grid-template-columns:repeat(2,minmax(0,1fr))}.chip{width:26px;height:26px}.chip.grande{width:40px;height:40px}}
.nota-camisas{margin:18px 0 0;font-size:.92rem;color:var(--tinta-2);max-width:70ch}
.tambem{margin:clamp(20px,3vh,32px) 0 0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:.95rem;color:var(--tinta-2)}
.tambem button{background:var(--papel);border:1px solid var(--linha);padding:6px 12px;font-size:.92rem}
.tambem button:hover{border-color:var(--ouro)}
.placa{scroll-margin-top:100px}
.placa>button{display:block;width:100%;background:none;border:0;padding:0;text-align:left}
.placa>button:hover .mat,.placa>button:focus-visible .mat{border-color:var(--ouro)}
.foto{position:relative;aspect-ratio:4/5;background:var(--foto);overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease}
.foto .costas{opacity:0}
@media (hover:hover){.placa>button:hover .costas,.placa>button:focus-visible .costas{opacity:1}}
.chips{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
.pilula{position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.95);border:1px solid var(--ouro-esc);color:var(--ouro-esc);font-size:.72rem;line-height:1.1;padding:4px 8px;font-weight:600}
.pilula.in{position:static;display:inline-block}
.epoca{margin-top:clamp(32px,5vh,52px);padding-top:22px;border-top:1px dashed var(--ouro)}
.epoca h4{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:0 0 6px}
.epoca p{margin:0;max-width:70ch;color:var(--tinta-2);font-size:.98rem}
.epoca .placas{margin-top:22px}
.aviso{border-left:3px solid var(--ouro);background:var(--papel);padding:12px 16px}
.aviso strong{font-family:var(--display);font-weight:600;display:block;font-size:1.1rem}
.aviso p{margin:4px 0 0;font-size:.98rem}
.legenda{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;padding:14px 4px 0}
.legenda .num{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(2.6rem,5vw,3.6rem);line-height:.8;grid-row:span 2;min-width:1.1ch}
.legenda .pais{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.1}
.legenda .meta{font-size:.9rem;color:var(--tinta-2);line-height:1.4}
.placa.destaque .mat{border-color:var(--campo);box-shadow:0 0 0 2px var(--campo)}

/* ---------- Sobre e rodapé ---------- */
.sobre{max-width:1500px;margin:0 auto;padding:clamp(28px,5vh,64px) var(--gutter) clamp(40px,7vh,88px);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,4vw,64px)}
.sobre h2{font-family:var(--display);font-weight:500;font-size:clamp(2.2rem,5.2vw,4.4rem);line-height:1;letter-spacing:-.01em;margin:0}
.sobre p{margin:0 0 1em;max-width:58ch;font-size:1.05rem;font-weight:300}
.sobre-sub{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.1;margin:2.2em 0 .7em;padding-top:1.2em;border-top:1px solid var(--ouro);max-width:58ch}
.contato{display:inline-block;margin-top:8px;font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--tinta);
  text-decoration-color:var(--ouro);text-decoration-thickness:2px;text-underline-offset:6px}
@media (max-width:760px){.sobre{grid-template-columns:1fr}}
footer{max-width:1500px;margin:0 auto;padding:20px var(--gutter) 56px;color:var(--tinta-2);font-size:.9rem;border-top:1px solid var(--linha)}

/* ---------- Ficha (diálogo) ---------- */
dialog{border:0;padding:0;background:var(--porcelana);color:var(--tinta);width:min(1180px,100vw);height:min(860px,100dvh);max-width:100vw;max-height:100dvh}
dialog::backdrop{background:rgba(16,38,31,.5)}
.ficha{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);height:100%}
.visor{position:relative;background:var(--papel);display:flex;flex-direction:column;min-height:0;padding:14px;gap:12px}
.visor .tela{position:relative;flex:1;min-height:0;overflow:hidden;cursor:zoom-in;touch-action:pan-y;background:var(--foto);border:1px solid var(--linha)}
.visor .tela.zoom{cursor:zoom-out;touch-action:none}
.visor .tela img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .25s ease,opacity .25s ease}
.visor .tela.zoom img{transform:scale(2.4)}
.lados{display:flex;border:1px solid var(--linha)}
.lados button{flex:1;padding:10px 8px;background:transparent;border:0;border-right:1px solid var(--linha);font-family:var(--display);font-weight:600;font-size:1.1rem}
.lados button:last-child{border-right:0}
.lados button[aria-pressed="true"]{background:var(--tinta);color:var(--porcelana)}
.dados{overflow:auto;padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--linha)}
.dados .topo{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dados .era-tag{font-size:.95rem;color:var(--tinta-2);margin:0}
.fechar{background:none;border:1px solid var(--linha);width:44px;height:44px;font-size:1.4rem;line-height:1;flex:none}
.dados h3{font-family:var(--display);font-weight:500;font-size:clamp(2rem,3.6vw,3.1rem);line-height:1.02;letter-spacing:-.01em;margin:0}
.dados .sub{margin:-6px 0 0;color:var(--tinta-2);font-weight:300}
.dados dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;border-top:1px solid var(--ouro);padding-top:16px}
.dados dt{color:var(--tinta-2);font-size:.92rem}
.dados dd{margin:0}
.comps{border-top:1px solid var(--linha);padding-top:14px}
.comps .t{font-size:.92rem;color:var(--tinta-2);margin:0 0 10px}
.comps ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.comps li{display:flex;gap:12px;align-items:center}
.comps li strong{font-family:var(--display);font-weight:600;font-size:1.15rem;display:block;line-height:1.2}
.comps li small{color:var(--tinta-2);font-size:.88rem}
.dados .historia{margin:0;font-size:1.05rem;font-weight:300}
.nav{margin-top:auto;display:flex;justify-content:space-between;gap:12px;padding-top:8px}
.nav button{background:none;border:1px solid var(--linha);padding:10px 18px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.nav button:hover{background:var(--papel);border-color:var(--ouro)}
@media (max-width:860px){
  dialog{width:100vw;height:100dvh}
  .ficha{grid-template-columns:1fr;grid-template-rows:minmax(0,54dvh) minmax(0,1fr)}
  .dados{border-left:0;border-top:1px solid var(--linha)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="barra"><a class="link-sobre" id="link-sobre" href="#sobre"></a><div class="idioma" id="idioma-topo"></div></div>

<header class="hero" id="topo">
  <div class="hero-in">
    <div>
      <p class="marca" id="marca"></p>
      <h1 id="titulo"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="selo" aria-hidden="true">
      <svg viewBox="0 0 400 400" focusable="false">
        <circle cx="200" cy="200" r="180"/>
        <line x1="200" y1="-24" x2="200" y2="20"/>
        <line x1="200" y1="380" x2="200" y2="424"/>
        <circle class="ponto" cx="200" cy="20" r="4"/>
        <circle class="ponto" cx="200" cy="380" r="4"/>
      </svg>
      <div class="selo-txt">
        <div class="selo-num" id="selo-num"></div>
        <div class="selo-leg" id="selo-leg"></div>
        <div class="selo-anos" id="selo-anos"></div>
      </div>
    </div>
  </div>
</header>


<div id="vista-home">
<section class="portas" id="portas" aria-label=""></section>

<nav class="trilho" id="trilho-nav" aria-label="">
  <div class="trilho-rolagem"><ol id="trilho"></ol></div>
</nav>

<div class="marcas-leg" id="legenda-marcas" role="note"></div>

<main id="colecoes"></main>
</div>

<div id="vista-sobre" hidden>
<section class="sobre" id="sobre" aria-labelledby="sobre-t">
  <h2 id="sobre-t"></h2>
  <div id="sobre-txt"></div>
</section>
</div>

<footer><div class="rodape-linha"><span id="rodape-txt"></span><span id="contato-rod"></span><div class="idioma" id="idioma-rodape"></div></div></footer>

<dialog id="ficha" aria-label="">
  <div class="ficha">
    <div class="visor">
      <div class="tela" id="tela"><img id="visor-img" alt=""></div>
      <div class="lados" id="lados" role="group" aria-label="">
        <button type="button" id="lado-f" aria-pressed="true"></button>
        <button type="button" id="lado-b" aria-pressed="false"></button>
      </div>
    </div>
    <div class="dados" id="dados"></div>
  </div>
</dialog>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
(function(){
  "use strict";
  var BASE = window.ACERVO, TR = window.ACERVO_I18N || {};
  var LANGS = [
    {id:"en", rot:"EN", nome:"English", html:"en"},
    {id:"es", rot:"ES", nome:"Español", html:"es"},
    {id:"br", rot:"BR", nome:"Português (Brasil)", html:"pt-BR"}
  ];
  var $ = function(s){ return document.querySelector(s); };
  var el = function(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
  var fmt = function(s, o){ return String(s).replace(/\{(\w+)\}/g, function(m,k){ return o[k]!=null ? o[k] : m; }); };
  var NS = "http://www.w3.org/2000/svg";
  var COR = { copa:"#1d4a3a", olimpiadas:"#a8812a", lenda:"#2e4a73" };

  var D, T, lang = "br", porId, capPorId, ordem, anoMin, anoMax, fichaId = null, fichaLado = "f";

  /* ---------- idioma: dados traduzidos sobre a base em português ---------- */
  function aplicar(base, tr){
    var d = JSON.parse(JSON.stringify(base));
    if (!tr) return d;
    if (tr.titulo != null) d.titulo = tr.titulo;
    if (tr.sobre) d.sobre = tr.sobre;
    if (tr.sobreNos) d.sobreNos = tr.sobreNos;
    if (tr.ui) Object.keys(tr.ui).forEach(function(k){ d.ui[k] = tr.ui[k]; });
    if (tr.usos && tr.usos.epoca) Object.keys(tr.usos.epoca).forEach(function(k){ d.usos.epoca[k] = tr.usos.epoca[k]; });
    if (tr.competicoes) Object.keys(tr.competicoes).forEach(function(id){ if (d.competicoes[id]) d.competicoes[id].nome = tr.competicoes[id]; });
    d.colecoes.forEach(function(col){
      var tc = tr.colecoes && tr.colecoes[col.id]; if (!tc) return;
      ["titulo","resumo","texto"].forEach(function(k){ if (tc[k]!=null) col[k] = tc[k]; });
      col.capitulos.forEach(function(cp){
        var t = tc.capitulos && tc.capitulos[cp.id]; if (!t) return;
        ["titulo","local","gancho","fatos","paragrafos","notaCamisas"].forEach(function(k){ if (t[k]!=null) cp[k] = t[k]; });
      });
    });
    d.camisas.forEach(function(c){
      var t = tr.camisas && tr.camisas[c.id]; if (!t) return;
      ["pais","titulo","nome","tipo","atribuicao","tamanho","marcas","detalhes","texto","usoTexto"].forEach(function(k){ if (t[k]!=null) c[k] = t[k]; });
      if (t.notas) (c.competicoes||[]).forEach(function(k){ if (t.notas[k.id]) k.nota = t.notas[k.id]; });
    });
    return d;
  }
  function detectar(){
    var q = /[?&]lang=(en|es|br|pt)/i.exec(location.search);
    if (q){ var v = q[1].toLowerCase(); return v==="pt" ? "br" : v; }
    try { var s = localStorage.getItem("acervo-lang"); if (s==="en"||s==="es"||s==="br") return s; } catch(e){}
    var n = String((navigator.languages && navigator.languages[0]) || navigator.language || "pt").toLowerCase();
    if (n.indexOf("pt")===0) return "br";
    if (n.indexOf("es")===0) return "es";
    return "en";
  }

  var alt = function(c,lado){ return fmt(T.altFmt, {t:c.titulo.toLowerCase(), p:c.pais, y:c.yearLabel, n:c.numero, l:(lado==="f"?T.ladoF:T.ladoB)}); };
  var rotulo = function(c){ return c.pais+" "+T.nr+" "+c.numero+(c.nome&&c.nome.indexOf(",")<0?" "+c.nome:""); };
  var rotStatus = function(st){ return st==="confirmado" ? T.rotConf : (st==="preparada" ? T.rotPrep : T.rotProv); };

  /* marcador: círculo = Copa do Mundo, losango = Olimpíadas */
  function chip(comp, status, cls){
    var s = document.createElementNS(NS,"svg");
    s.setAttribute("viewBox","0 0 32 32");
    s.setAttribute("class","chip "+(status==="confirmado"?"ok":(status==="preparada"?"prep":"prov"))+(cls?" "+cls:""));
    var rot = comp.nome ? comp.nome+rotStatus(status) : "";
    if (rot){ s.setAttribute("role","img"); s.setAttribute("aria-label", rot); var t = document.createElementNS(NS,"title"); t.textContent = rot; s.appendChild(t); }
    else s.setAttribute("aria-hidden","true");
    var f;
    if (comp.tipo==="copa"){ f = document.createElementNS(NS,"circle"); f.setAttribute("cx","16"); f.setAttribute("cy","16"); f.setAttribute("r","14"); }
    else { f = document.createElementNS(NS,"polygon"); f.setAttribute("points","16,2 30,16 16,30 2,16"); }
    f.setAttribute("class","f"); s.appendChild(f);
    if (comp.ano){ var x = document.createElementNS(NS,"text"); x.setAttribute("x","16"); x.setAttribute("y","19.6"); x.textContent = "\u2019"+String(comp.ano).slice(2); s.appendChild(x); }
    return s;
  }
  function chipsDe(c){
    var box = el("div","chips");
    (c.competicoes||[]).forEach(function(k){ var comp = D.competicoes[k.id]; if (comp) box.appendChild(chip(comp,k.status)); });
    return box;
  }
  function vazio(n){ while (n.firstChild) n.removeChild(n.firstChild); return n; }

  /* ---------- seletor de idioma ---------- */
  var seletores = [];
  function montarSeletor(box){
    box.setAttribute("role","group");
    LANGS.forEach(function(L){
      var b = el("button",null,L.rot); b.type = "button"; b.setAttribute("lang", L.html); b.setAttribute("aria-label", L.nome); b.title = L.nome; b.dataset.l = L.id;
      b.addEventListener("click", function(){ setLang(L.id, true); });
      box.appendChild(b);
    });
    seletores.push(box);
  }
  function atualizarSeletores(){
    seletores.forEach(function(box){
      box.setAttribute("aria-label", T.selGrupo);
      [].forEach.call(box.querySelectorAll("button"), function(b){ b.setAttribute("aria-pressed", b.dataset.l===lang ? "true" : "false"); });
    });
  }

  /* ---------- construção da página no idioma atual ---------- */
  function construir(){
    porId = {}; D.camisas.forEach(function(c){ porId[c.id]=c; });
    capPorId = {};
    D.colecoes.forEach(function(col){ col.capitulos.forEach(function(cp){ cp.col = col; capPorId[cp.id] = cp; }); });
    ordem = [];
    var anos = D.camisas.map(function(c){return c.year;});
    anoMin = Math.min.apply(null,anos); anoMax = Math.max.apply(null,anos);

    var L = LANGS.filter(function(x){ return x.id===lang; })[0];
    document.documentElement.lang = L.html;
    document.title = T.docTitle;
    [["meta[name=description]","content"],["meta[property='og:description']","content"]].forEach(function(p){ var m=$(p[0]); if(m) m.setAttribute(p[1], T.metaDesc); });
    var og = $("meta[property='og:title']"); if (og) og.setAttribute("content", T.docTitle);

    /* abertura */
    $("#marca").textContent = D.nome+(D.local?" · "+D.local:"");
    $("#titulo").textContent = D.titulo;
    $("#sub").innerHTML = fmt(T.sub, {n:D.camisas.length, a:anoMin, b:anoMax, c:D.colecoes.length});
    $("#selo-num").textContent = String(D.camisas.length);
    $("#selo-leg").textContent = T.selo;
    $("#selo-anos").textContent = anoMin+" \u2013 "+anoMax;
    $("#portas").setAttribute("aria-label", T.colecoesAria);
    $("#trilho-nav").setAttribute("aria-label", T.trilhoAria);
    $("#sobre-t").textContent = T.sobreTit;
    $("#ficha").setAttribute("aria-label", T.fichaAria);
    $("#lado-f").textContent = T.frente; $("#lado-b").textContent = T.costas;
    $("#lados").setAttribute("aria-label", T.ladoAria);

    /* portas */
    var portas = vazio($("#portas"));
    D.colecoes.forEach(function(col){
      var lista = D.camisas.filter(function(c){ return c.colecao===col.id; });
      var a = el("a","porta"); a.href = "#colecao-"+col.id;
      var tx = el("div"); tx.appendChild(el("h2",null,col.titulo));
      tx.appendChild(el("p",null,fmt(T.camisasN,{n:lista.length})+" · "+col.resumo));
      var fotos = el("div","fotos"); fotos.setAttribute("aria-hidden","true");
      lista.slice(0,3).forEach(function(c){ var im = el("img"); im.src = c.img.f; im.alt = ""; im.loading="lazy"; fotos.appendChild(im); });
      a.appendChild(tx); a.appendChild(fotos); portas.appendChild(a);
    });

    /* legenda dos marcadores */
    var leg = vazio($("#legenda-marcas"));
    [["copa","confirmado",T.legCopa],["olimpiadas","confirmado",T.legOlim],["copa","provavel",T.legProv],["copa","preparada",T.legPrep]].forEach(function(x){
      var i = el("span","it"); i.appendChild(chip({tipo:x[0]},x[1])); i.appendChild(document.createTextNode(x[2])); leg.appendChild(i);
    });
    var ie = el("span","it"); ie.appendChild(el("span","pilula in",D.usos.epoca.rotulo)); ie.appendChild(document.createTextNode(T.legSemNome)); leg.appendChild(ie);

    /* coleções e capítulos */
    var main = vazio($("#colecoes"));
    D.colecoes.forEach(function(col){
      var sec = el("section","colecao"); sec.id = "colecao-"+col.id; sec.setAttribute("aria-labelledby","h-"+col.id);
      var cab = el("div","col-cab");
      var esq = el("div"); var h = el("h2",null,col.titulo); h.id = "h-"+col.id; esq.appendChild(h);
      esq.appendChild(el("p","resumo",col.resumo));
      cab.appendChild(esq); cab.appendChild(el("p","intro",col.texto)); sec.appendChild(cab);
      col.capitulos.forEach(function(cp){
        var cap = el("article","cap"); cap.id = "cap-"+cp.id; cap.style.setProperty("--cor", COR[cp.tipo]);
        var ch = el("div","cap-cab"), tit = el("div","cap-tit");
        if (cp.tipo==="lenda"){ var st = el("span","estrela-g","\u2605"); st.setAttribute("aria-hidden","true"); tit.appendChild(st); }
        else tit.appendChild(chip({tipo:cp.tipo, ano:cp.ano}, "confirmado", "grande"));
        var tt = el("div"); tt.appendChild(el("h3",null,cp.titulo)); tt.appendChild(el("p","local",cp.local));
        tit.appendChild(tt); ch.appendChild(tit); ch.appendChild(el("p","gancho",cp.gancho)); cap.appendChild(ch);
        var corpo = el("div","cap-corpo"), dl = el("dl","fatos");
        cp.fatos.forEach(function(f){ var d = el("div"); d.appendChild(el("dt",null,f[0])); d.appendChild(el("dd",null,f[1])); dl.appendChild(d); });
        var his = el("div","historia-cap"); cp.paragrafos.forEach(function(p){ his.appendChild(el("p",null,p)); });
        corpo.appendChild(dl); corpo.appendChild(his); cap.appendChild(corpo);
        var todas = D.camisas.filter(function(c){ return c.capitulo===cp.id; }).sort(function(a,b){ return a.year-b.year; });
        var daComp = todas.filter(function(c){ return c.uso!=="epoca"; });
        var daEpoca = todas.filter(function(c){ return c.uso==="epoca"; });
        if (daComp.length){
          var ul = el("ul","placas"); daComp.forEach(function(c){ ul.appendChild(placa(c)); ordem.push(c); }); cap.appendChild(ul);
        }
        if (cp.notaCamisas) cap.appendChild(el("p","nota-camisas",cp.notaCamisas));
        if (daEpoca.length){
          var ep = el("div","epoca"); ep.appendChild(el("h4",null,T.epocaTit)); ep.appendChild(el("p",null,D.usos.epoca.texto));
          var ul2 = el("ul","placas"); daEpoca.forEach(function(c){ ul2.appendChild(placa(c)); ordem.push(c); }); ep.appendChild(ul2); cap.appendChild(ep);
        }
        if (cp.competicao){
          var outras = D.camisas.filter(function(c){ return c.capitulo!==cp.id && (c.competicoes||[]).some(function(k){ return k.id===cp.competicao; }); });
          if (outras.length){
            var tb = el("div","tambem"); tb.appendChild(el("span",null,T.tambem));
            outras.forEach(function(c){ var bt2 = el("button",null,rotulo(c)); bt2.type="button"; bt2.addEventListener("click", function(){ abrir(c.id); }); tb.appendChild(bt2); });
            cap.appendChild(tb);
          }
        }
        sec.appendChild(cap);
      });
      main.appendChild(sec);
    });
    D.camisas.forEach(function(c){ if (ordem.indexOf(c)<0) ordem.push(c); });

    /* trilho */
    var trilho = vazio($("#trilho"));
    D.colecoes.forEach(function(col, ci){
      col.capitulos.forEach(function(cp, i){
        var li = el("li"); if (ci>0 && i===0) li.className = "sep";
        var a = el("a"); a.href = "#cap-"+cp.id; a.dataset.id = cp.id; a.style.setProperty("--cor", COR[cp.tipo]);
        var b1 = el("span","barra"); b1.setAttribute("aria-hidden","true"); a.appendChild(b1);
        var l1 = el("span","linha1");
        if (cp.tipo==="lenda"){ l1.appendChild(el("span","estrela","\u2605")); l1.lastChild.setAttribute("aria-hidden","true"); }
        else l1.appendChild(chip({tipo:cp.tipo}, "confirmado", "mini"));
        l1.appendChild(el("span","ano", String(cp.ano))); a.appendChild(l1);
        a.appendChild(el("span","nome", cp.tipo==="copa"?T.copaRot:(cp.tipo==="olimpiadas"?T.olimpRot:cp.titulo)));
        a.setAttribute("aria-label", cp.titulo);
        li.appendChild(a); trilho.appendChild(li);
      });
    });
    marcar();

    /* sobre e rodapé */
    var st = vazio($("#sobre-txt"));
    (D.sobreNos||[]).forEach(function(t){ st.appendChild(el("p",null,t)); });
    if (D.sobre && D.sobre.length){ st.appendChild(el("h3","sobre-sub",T.acervoTit)); D.sobre.forEach(function(t){ st.appendChild(el("p",null,t)); }); }
    var cr = vazio($("#contato-rod"));
    if (D.contato && D.contato.usuario){
      var href = "mailto:"+D.contato.usuario+"@"+D.contato.dominio+(D.contato.assunto?"?subject="+encodeURIComponent(D.contato.assunto):"");
      var a2 = el("a","contato",T.contato); a2.href = href; st.appendChild(a2);
      var a3 = el("a","contato-rod",T.contato); a3.href = href; cr.appendChild(a3);
    }
    $("#rodape-txt").textContent = fmt(T.rodape, {nome:D.nome, local:(D.local?" · "+D.local:""), n:D.camisas.length, a:anoMin, b:anoMax});
    atualizarSeletores();
    rota();
  }

  function placa(c){
    var li = el("li","placa"); li.id = c.id;
    var b = el("button"); b.type="button";
    var comps = (c.competicoes||[]).map(function(k){ var cp=D.competicoes[k.id]; return cp ? cp.nome+rotStatus(k.status) : ""; }).filter(Boolean);
    b.setAttribute("aria-label", T.abrirFicha+c.pais+", "+c.titulo+", "+c.yearLabel+(comps.length?". "+comps.join(", "):"")+(c.uso==="epoca"?". "+T.foraCompAria:""));
    var mat = el("div","mat"), f = el("div","foto");
    var i1 = el("img"); i1.src=c.img.f; i1.alt=alt(c,"f"); i1.loading="lazy"; i1.decoding="async";
    var i2 = el("img","costas"); i2.src=c.img.b; i2.alt=""; i2.loading="lazy"; i2.decoding="async";
    f.appendChild(i1); f.appendChild(i2);
    if ((c.competicoes||[]).length) f.appendChild(chipsDe(c));
    if (c.uso==="epoca") f.appendChild(el("span","pilula",D.usos.epoca.rotulo));
    mat.appendChild(f);
    var lg = el("div","legenda");
    lg.appendChild(el("span","num",c.numero));
    lg.appendChild(el("span","pais",c.pais));
    lg.appendChild(el("span","meta",c.titulo+" · "+c.yearLabel+" · "+c.fabricante));
    b.appendChild(mat); b.appendChild(lg); li.appendChild(b);
    b.addEventListener("click", function(){ abrir(c.id); });
    return li;
  }

  /* trilho: destaca o capítulo visível */
  var raf = null;
  function marcar(){
    raf = null; var atual = null;
    var links = [].slice.call(document.querySelectorAll(".trilho a"));
    links.forEach(function(a){ var alvo = document.getElementById("cap-"+a.dataset.id); if (alvo && alvo.getBoundingClientRect().top <= 150) atual = a; });
    links.forEach(function(a){ if (a===atual){ a.setAttribute("aria-current","true");
      var r = a.closest(".trilho-rolagem"), ar = a.getBoundingClientRect(), rr = r.getBoundingClientRect();
      if (ar.left < rr.left || ar.right > rr.right) r.scrollLeft += (ar.left-rr.left)-(rr.width-ar.width)/2;
    } else a.removeAttribute("aria-current"); });
  }
  window.addEventListener("scroll", function(){ if(!raf) raf = requestAnimationFrame(marcar); }, {passive:true});

  /* ---------- ficha ---------- */
  var dlg = $("#ficha"), tela = $("#tela"), vimg = $("#visor-img"), dados = $("#dados");
  var atual = 0, ultimoFoco = null;
  var idx = function(id){ for (var i=0;i<ordem.length;i++) if (ordem[i].id===id) return i; return 0; };
  function linha(dl, k, v){ if(!v) return; dl.appendChild(el("dt",null,k)); dl.appendChild(el("dd",null,v)); }
  function mostrarLado(l){
    fichaLado = l;
    var c = ordem[atual]; vimg.src = c.img[l]; vimg.alt = alt(c,l);
    tela.classList.remove("zoom");
    $("#lado-f").setAttribute("aria-pressed", l==="f"); $("#lado-b").setAttribute("aria-pressed", l==="b");
  }
  function montar(){
    var c = ordem[atual], cp = capPorId[c.capitulo];
    fichaId = c.id;
    vazio(dados);
    var topo = el("div","topo");
    topo.appendChild(el("p","era-tag", cp ? cp.titulo+" · "+cp.col.titulo : ""));
    var x = el("button","fechar","×"); x.type="button"; x.setAttribute("aria-label",T.fechar); x.addEventListener("click", function(){ dlg.close(); });
    topo.appendChild(x); dados.appendChild(topo);
    dados.appendChild(el("h3",null,c.pais+" "+c.yearLabel));
    dados.appendChild(el("p","sub",c.titulo));
    var dl = el("dl");
    linha(dl,T.rSelecao,c.pais); linha(dl,T.rEpoca,c.yearLabel); linha(dl,T.rFab,c.fabricante); linha(dl,T.rNum,c.numero);
    linha(dl,T.rNome,c.nome); linha(dl,T.rTipo,c.tipo); linha(dl,T.rAtrib,c.atribuicao); linha(dl,T.rTam,c.tamanho);
    linha(dl,T.rEstado,c.estado); linha(dl,T.rProc,c.procedencia); linha(dl,T.rMarcas,c.marcas); linha(dl,T.rDet,c.detalhes);
    dados.appendChild(dl);
    if (c.uso==="epoca"){
      var av = el("div","aviso"); av.appendChild(el("strong",null,T.foraComp));
      av.appendChild(el("p",null,c.usoTexto||D.usos.epoca.texto)); dados.appendChild(av);
    }
    var cs = (c.competicoes||[]).filter(function(k){ return D.competicoes[k.id]; });
    if (cs.length){
      var bx = el("div","comps"); bx.appendChild(el("p","t",T.competicoes));
      var ul = el("ul");
      cs.forEach(function(k){
        var comp = D.competicoes[k.id], li = el("li");
        li.appendChild(chip({tipo:comp.tipo, ano:comp.ano}, k.status));
        var tx = el("span"); tx.appendChild(el("strong",null,comp.nome));
        tx.appendChild(el("small",null, k.nota || (k.status==="confirmado" ? T.stConf : (k.status==="preparada" ? T.stPrep : T.stProv))));
        li.appendChild(tx); ul.appendChild(li);
      });
      bx.appendChild(ul); dados.appendChild(bx);
    }
    if (c.texto) dados.appendChild(el("p","historia",c.texto));
    var nav = el("div","nav");
    var ant = el("button",null,T.anterior), prox = el("button",null,T.proxima);
    ant.type = prox.type = "button";
    ant.disabled = atual===0; prox.disabled = atual===ordem.length-1;
    ant.style.opacity = ant.disabled?.4:1; prox.style.opacity = prox.disabled?.4:1;
    ant.addEventListener("click", function(){ ir(-1); }); prox.addEventListener("click", function(){ ir(1); });
    nav.appendChild(ant); nav.appendChild(prox); dados.appendChild(nav);
    dados.scrollTop = 0;
  }
  function ir(d){ var n = atual+d; if(n<0||n>=ordem.length) return; atual = n; montar(); mostrarLado("f"); }
  function abrir(id){
    ultimoFoco = document.activeElement; atual = idx(id); montar(); mostrarLado("f");
    if (typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
    document.body.style.overflow = "hidden";
  }
  dlg.addEventListener("close", function(){ document.body.style.overflow=""; fichaId = null; if(ultimoFoco&&ultimoFoco.focus) ultimoFoco.focus(); });
  dlg.addEventListener("click", function(ev){ if (ev.target===dlg) dlg.close(); });
  dlg.addEventListener("keydown", function(ev){ if (ev.key==="ArrowRight") ir(1); else if (ev.key==="ArrowLeft") ir(-1); });
  $("#lado-f").addEventListener("click", function(){ mostrarLado("f"); });
  $("#lado-b").addEventListener("click", function(){ mostrarLado("b"); });
  function origem(ev){
    var r = tela.getBoundingClientRect();
    tela.style.setProperty("--ox", Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100))+"%");
    tela.style.setProperty("--oy", Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100))+"%");
  }
  tela.addEventListener("click", function(ev){ origem(ev); tela.classList.toggle("zoom"); });
  tela.addEventListener("pointermove", function(ev){ if (tela.classList.contains("zoom") && (ev.pointerType==="mouse" || ev.buttons)) origem(ev); });

  /* ---------- vistas: Home e Sobre ---------- */
  function rota(){
    var s = location.hash === "#sobre";
    $("#vista-home").hidden = s; $("#vista-sobre").hidden = !s; $("#topo").hidden = s;
    var ls = $("#link-sobre"); ls.textContent = s ? T.voltar : T.sobreLink; ls.setAttribute("href", s ? "#topo" : "#sobre");
    document.title = s ? T.sobreTit+" · "+D.nome : T.docTitle;
  }
  window.addEventListener("hashchange", function(){
    rota(); var h = location.hash;
    if (h==="#sobre" || h==="#topo" || h==="") window.scrollTo(0,0);
  });

  /* ---------- troca de idioma ---------- */
  function setLang(id, salvar){
    if (id!=="en" && id!=="es") id = "br";
    lang = id;
    D = aplicar(BASE, id==="br" ? null : TR[id]);
    T = D.ui;
    construir();
    if (fichaId && dlg.open){ var lado = fichaLado; atual = idx(fichaId); montar(); mostrarLado(lado); }
    if (salvar){
      try { localStorage.setItem("acervo-lang", id); } catch(e){}
      try { var u = new URL(location.href); u.searchParams.set("lang", id); history.replaceState(null, "", u.toString()); } catch(e){}
    }
  }

  montarSeletor($("#idioma-topo")); montarSeletor($("#idioma-rodape"));
  setLang(detectar(), false);
})();
</script>
